<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Pac-Man</title>
  <link rel="stylesheet" href="pacman.css">
  <script src="pacman.js" defer></script>
</head>
<body>
  <main>
    <div class="cabinet">
      <canvas id="game" aria-label="Pac-Man maze game"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="overlayTitle">PAC-MAN</h1>
        <p id="overlayText"></p>
        <button id="overlayButton" type="button">Start</button>
      </div>
    </div>
    <div class="touch-controls" aria-label="Touch controls">
      <button type="button" data-dir="up" aria-label="Up">▲</button>
      <button type="button" data-dir="left" aria-label="Left">◀</button>
      <button type="button" data-dir="down" aria-label="Down">▼</button>
      <button type="button" data-dir="right" aria-label="Right">▶</button>
    </div>
    <p class="help">
      <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move ·
      <kbd>P</kbd> pause · <kbd>M</kbd> mute
    </p>
  </main>
</body>
</html>
